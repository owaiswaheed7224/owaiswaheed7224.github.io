<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Shipment | Arham Freight Logistics</title>

<style>
:root {
  --blue:#0d6efd;
  --blue-dark:#0757c9;
  --blue-deep:#063b8f;
  --blue-soft:#eaf3ff;
  --ink:#10264b;
  --muted:#65748b;
  --line:#dce8f7;
  --white:#fff;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;
  color:var(--ink);
  background:#f6faff;
  overflow-x:hidden;
}
a{text-decoration:none;color:inherit}

header{
  height:84px;
  background:#fff;
  border-bottom:1px solid #e7eef8;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 clamp(20px,6vw,90px);
  position:relative;
  z-index:20;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}
.brand img{
  width:64px;height:64px;object-fit:contain;
}
.brand-text{
  font-size:19px;
  font-weight:800;
  color:var(--blue);
  letter-spacing:.2px;
}
.brand-text span{
  display:block;
  font-size:10px;
  letter-spacing:2.2px;
  color:#ff9700;
  margin-top:1px;
}

nav{
  display:flex;
  align-items:center;
  gap:34px;
}
nav a{
  font-size:15px;
  font-weight:600;
  color:#1b2a41;
  position:relative;
  padding:30px 0;
}
nav a:hover,nav a.active{color:var(--blue)}
nav a.active:after{
  content:"";
  position:absolute;
  left:0;right:0;bottom:20px;
  height:3px;border-radius:3px;
  background:var(--blue);
}

.call-btn{
  background:var(--blue);
  color:white;
  padding:13px 20px;
  border-radius:8px;
  font-weight:700;
  box-shadow:0 8px 20px rgba(13,110,253,.2);
}
.call-btn:hover{background:var(--blue-dark)}

/* HERO */
.hero{
  min-height:490px;
  position:relative;
  overflow:hidden;
  color:white;
  background:
    radial-gradient(circle at 80% 20%,rgba(94,172,255,.55),transparent 26%),
    linear-gradient(115deg,#063b8f 0%,#0d6efd 55%,#0757c9 100%);
}

.hero:before{
  content:"";
  position:absolute;inset:0;
  opacity:.23;
  background-image:
    linear-gradient(rgba(255,255,255,.16) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.16) 1px,transparent 1px);
  background-size:54px 54px;
  transform:perspective(500px) rotateX(55deg) scale(1.5);
  transform-origin:center bottom;
  animation:gridMove 10s linear infinite;
}
@keyframes gridMove{to{background-position:54px 54px}}

.hero-inner{
  max-width:1240px;
  margin:auto;
  min-height:490px;
  padding:65px 28px 120px;
  display:grid;
  grid-template-columns:1fr 1fr;
  align-items:center;
  gap:30px;
  position:relative;
  z-index:2;
}

.hero-copy{
  max-width:620px;
}
.kicker{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:rgba(255,255,255,.13);
  border:1px solid rgba(255,255,255,.25);
  padding:7px 14px;
  border-radius:30px;
  font-size:12px;
  font-weight:700;
  letter-spacing:1px;
  margin-bottom:18px;
}
.kicker i{
  width:7px;height:7px;border-radius:50%;
  background:#ff9700;
  box-shadow:0 0 12px #ff9700;
}

.hero h1{
  font-size:clamp(43px,5.2vw,70px);
  line-height:.98;
  letter-spacing:-2px;
  margin-bottom:20px;
}
.hero p{
  color:#eaf4ff;
  font-size:18px;
  line-height:1.7;
  max-width:560px;
}

.search-card{
  max-width:1060px;
  margin:-52px auto 0;
  position:relative;
  z-index:8;
  background:#fff;
  border:1px solid #e3edf9;
  border-radius:18px;
  box-shadow:0 18px 50px rgba(9,66,130,.14);
  padding:25px;
}
.search-row{
  display:grid;
  grid-template-columns:58px 1fr 150px;
  gap:14px;
  align-items:center;
}
.search-icon{
  width:58px;height:58px;border-radius:50%;
  background:var(--blue);
  color:white;
  display:grid;place-items:center;
  font-size:26px;
  box-shadow:0 8px 18px rgba(13,110,253,.22);
}
input{
  width:100%;height:58px;
  border:1px solid #d4dfed;
  border-radius:10px;
  padding:0 18px;
  font-size:16px;
  outline:none;
  color:#182a43;
}
input:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 4px rgba(13,110,253,.1);
}
.track-btn{
  height:58px;
  border:0;border-radius:10px;
  background:var(--blue);
  color:#fff;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 8px 18px rgba(13,110,253,.22);
}
.track-btn:hover{background:var(--blue-dark)}
.search-note{
  margin:16px 0 0 73px;
  color:#718096;
  font-size:13px;
}
.search-note b{color:var(--blue)}

/* RESULTS */
#result{
  max-width:1060px;
  margin:28px auto 0;
  padding:0 20px;
}
.result-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 14px 40px rgba(10,64,120,.08);
}
.result-top{
  padding:25px 28px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  border-bottom:1px solid var(--line);
}
.label{font-size:12px;color:var(--muted);letter-spacing:.8px}
.number{font-size:25px;font-weight:800;margin-top:4px}
.status{
  background:#eaf3ff;color:var(--blue);
  padding:9px 16px;border-radius:30px;
  font-weight:800;font-size:13px;
  border: 1px solid #b6d4fe;
}
.details{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:15px;padding:24px 28px;
}
.detail{
  background:#f7fbff;border:1px solid var(--line);
  border-radius:12px;padding:17px;
}
.detail small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;margin-bottom:6px}
.detail strong{font-size:15px}
.history{padding:0 28px 30px}
.history h3{font-size:19px;margin:5px 0 22px}
.timeline{border-left:3px solid #cfe2ff;margin-left:10px;padding-left:28px}
.event{position:relative;padding:0 0 25px}
.event:last-child{padding-bottom:0}
.event-dot{
  position:absolute;left:-37px;top:2px;
  width:15px;height:15px;border-radius:50%;
  background:var(--blue);border:3px solid #fff;
  box-shadow:0 0 0 1px var(--blue);
}
.event h4{font-size:15px;margin-bottom:3px;font-weight:700;color:var(--ink)}
.event p.remarks-text{font-size:14px;color:#2c3e50;margin-top:4px;font-weight:500;background:#f8fafc;padding:8px 12px;border-radius:6px;border-left:3px solid var(--blue)}
.event p.meta-text{font-size:12px;color:var(--muted);margin-top:4px}

.error{
  background:#fff;border:1px solid #ffd5d9;border-radius:16px;
  text-align:center;padding:35px;color:#6c757d;
}
.error h3{color:#182a43;margin-bottom:7px}
.error strong{color:#dc3545}

/* FOOTER */
footer{
  background:var(--blue);
  color:white;
  padding:25px 6%;
  margin-top: 50px;
}
.copyright{
  max-width:1200px;margin:auto;
  text-align:center;font-size:13px;color:#e8f2ff;
}

@media(max-width:900px){
  nav{display:none}
  .hero-inner{grid-template-columns:1fr;min-height:auto;padding-bottom:125px}
}
@media(max-width:650px){
  header{height:72px}
  .brand img{width:54px;height:54px}
  .brand-text{font-size:16px}
  .call-btn{display:none}
  .hero{min-height:350px}
  .hero-inner{padding:40px 20px 90px}
  .search-card{margin:-45px 14px 0;padding:17px}
  .search-row{grid-template-columns:1fr}
  .search-icon{display:none}
  .search-note{margin:13px 0 0}
  #result{padding:0 14px}
  .result-top{align-items:flex-start;flex-direction:column}
  .details{grid-template-columns:1fr;padding:20px}
  .history{padding:0 20px 25px}
}
</style>
</head>

<body>

<header>
  <a class="brand" href="index.html">
    <div class="brand-text">ARHAM <span>FREIGHT LOGISTICS</span></div>
  </a>
  <nav>
    <a href="index.html">Home</a>
    <a href="tracking.html" class="active">Tracking</a>
  </nav>
</header>

<section class="hero">
  <div class="hero-inner">
    <div class="hero-copy">
      <div class="kicker"><i></i> LIVE TRACKING</div>
      <h1>Track Your Shipment Details</h1>
      <p>Enter your AWB / Shipment number below to get live movement details & status updates.</p>
    </div>
  </div>
</section>

<div class="search-card">
  <div class="search-row">
    <div class="search-icon">🔍</div>
    <input id="awbInput" type="text" placeholder="Enter AWB / Shipment Number..." onkeypress="handleKeyPress(event)">
    <button class="track-btn" onclick="trackShipment()">TRACK</button>
  </div>
  <div class="search-note">Enter your <b>AWB Tracking Number</b> to view real-time movement history.</div>
</div>

<div id="result"></div>

<footer>
  <div class="copyright">
    &copy; 2026 Arham Freight Logistics. All Rights Reserved.
  </div>
</footer>

<script>
const TRACKING_API_URL = "https://script.google.com/macros/s/AKfycbwFGbq2qQw_wXx1vKKry5rJPL6TlPYYUMJMyOpoCM7T67TyfKta9t97wvOCkjdlC2_B/exec";

function handleKeyPress(e) {
  if (e.key === 'Enter') {
    trackShipment();
  }
}

function trackShipment() {
  const awb = document.getElementById("awbInput").value.trim();
  const resDiv = document.getElementById("result");

  if (!awb) {
    resDiv.innerHTML = '<div class="error"><h3>Please Enter AWB</h3><p>Shipment / Tracking number is required.</p></div>';
    return;
  }

  resDiv.innerHTML = '<div class="error"><h3>Searching...</h3><p>Fetching real-time tracking details.</p></div>';

  const callbackName = "__arhamTrackingPub_" + Date.now();
  window[callbackName] = function(result) {
    delete window[callbackName];
    if (script.parentNode) script.parentNode.removeChild(script);

    if (!result || !result.success) {
      resDiv.innerHTML = '<div class="error"><h3>Shipment Not Found</h3><p>' + ((result && result.message) || 'Invalid Tracking / AWB Number.') + '</p></div>';
      return;
    }

    renderResult(result);
  };

  const script = document.createElement("script");
  script.src = TRACKING_API_URL + "?action=searchshipmentstatus&awb=" + encodeURIComponent(awb) + "&callback=" + callbackName + "&_=" + Date.now();
  script.onerror = function() {
    resDiv.innerHTML = '<div class="error"><h3>Server Error</h3><p>Unable to connect to tracking server. Please try again.</p></div>';
  };
  document.head.appendChild(script);
}

function renderResult(data) {
  const shipment = data.shipment || {};
  const history = data.history || [];
  const latestStatus = history.length > 0 ? (history[0].statusType || history[0].status || 'In Transit') : 'Booked';

  let historyHtml = '';
  if (history.length === 0) {
    historyHtml = '<p style="color:var(--muted);">No movement updates recorded yet.</p>';
  } else {
    historyHtml = history.map(function(item) {
      const type = item.statusType || item.status || 'Status Update';
      const remarks = item.remarks || item.status || '';
      const location = (item.city || '') + (item.city && item.country ? ', ' : '') + (item.country || '');
      const timeStr = shortDateTime(item.dateTime);

      return `
        <div class="event">
          <div class="event-dot"></div>
          <h4>${escapeHtml(type)}</h4>
          ${remarks ? `<p class="remarks-text">${escapeHtml(remarks)}</p>` : ''}
          <p class="meta-text">
            ${location ? `📍 <strong>${escapeHtml(location)}</strong> &nbsp;|&nbsp; ` : ''}
            🕒 ${escapeHtml(timeStr)}
          </p>
        </div>
      `;
    }).join('');
  }

  document.getElementById("result").innerHTML = `
    <div class="result-card">
      <div class="result-top">
        <div>
          <div class="label">SHIPMENT / AWB NUMBER</div>
          <div class="number">${escapeHtml(shipment.shipmentNumber || '')}</div>
        </div>
        <div class="status">${escapeHtml(latestStatus)}</div>
      </div>
      <div class="details">
        <div class="detail">
          <small>Customer Name</small>
          <strong>${escapeHtml(shipment.customerName || '—')}</strong>
        </div>
        <div class="detail">
          <small>Consignee Name</small>
          <strong>${escapeHtml(shipment.consigneeName || '—')}</strong>
        </div>
        <div class="detail">
          <small>Booking Date</small>
          <strong>${escapeHtml(shortDate(shipment.bookingDate))}</strong>
        </div>
      </div>
      <div class="history">
        <h3>Shipment Movement History</h3>
        <div class="timeline">
          ${historyHtml}
        </div>
      </div>
    </div>
  `;
}

function shortDateTime(value) {
  if (!value) return "—";
  const d = new Date(String(value).trim());
  if (!isNaN(d.getTime())) {
    return d.toLocaleString("en-GB", {
      day: "2-digit", month: "short", year: "numeric",
      hour: "2-digit", minute: "2-digit", hour12: true
    });
  }
  return String(value);
}

function shortDate(value) {
  if (!value) return "—";
  const d = new Date(String(value).trim());
  if (!isNaN(d.getTime())) {
    return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
  }
  return String(value);
}

function escapeHtml(v) {
  return String(v || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}
</script>

</body>
</html>
