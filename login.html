<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Arham Dashboard</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <script type="module">

    // Firebase SDK
    import { initializeApp } 
      from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      setPersistence,
      browserLocalPersistence
    } 
      from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";


    // =========================================================
    // FIREBASE CONFIG
    // SAME PROJECT AS index.html + dashboard.html
    // =========================================================

    const firebaseConfig = {
      apiKey: "AIzaSyB9VfTFlYpAjEOryx5tUx8Sq0LGKIjwgYU",
      authDomain: "arhamfreight.firebaseapp.com",
      projectId: "arhamfreight",
      storageBucket: "arhamfreight.firebasestorage.app",
      messagingSenderId: "113027178773",
      appId: "1:113027178773:web:e644cd60f86bbbee06c91c",
      measurementId: "G-FQ4NX3F1HZ"
    };


    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);


    // =========================================================
    // LOGIN FUNCTION
    // =========================================================

    window.loginUser = async function () {

      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const msg = document.getElementById("message");
      const loginBtn = document.getElementById("loginBtn");

      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();


      // Clear old message
      msg.innerHTML = "";


      // Validation
      if (!email || !password) {
        msg.innerHTML =
          "<span class='text-danger'>Please enter both email and password.</span>";
        return;
      }


      // Disable button while logging in
      loginBtn.disabled = true;
      loginBtn.innerText = "Logging in...";


      try {

        // =====================================================
        // CLEAR OLD SHIPMENT EDIT / PREVIEW DATA
        // =====================================================

        sessionStorage.removeItem("selectedShipment");
        sessionStorage.removeItem("bookingOpenMode");
        sessionStorage.removeItem("bookingRowNumber");

        localStorage.removeItem("selectedShipment");
        localStorage.removeItem("bookingOpenMode");
        localStorage.removeItem("bookingRowNumber");


        // =====================================================
        // IMPORTANT:
        // USE LOCAL FIREBASE AUTH PERSISTENCE
        //
        // This keeps the Firebase login active in the browser
        // and allows the authentication state to be available
        // across multiple tabs of the same website.
        // =====================================================

        await setPersistence(auth, browserLocalPersistence);


        // =====================================================
        // FIREBASE LOGIN
        // =====================================================

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );


        msg.innerHTML =
          "<span class='text-success'>Login successful! Redirecting...</span>";


        // Small delay so user can see success message
        setTimeout(() => {

          // ===================================================
          // ADMIN CHECK
          // SAME ADMIN EMAIL USED BY dashboard.html
          // ===================================================

          if (email.toLowerCase() === "owaiswaheed@gmail.com") {

            window.location.href = "admin.html";

          } else {

            window.location.href = "dashboard.html";

          }

        }, 500);


      } catch (error) {

        console.error("Firebase Login Error:", error);

        let errorMessage = "Login failed. Please try again.";

        if (error.code === "auth/invalid-credential") {
          errorMessage = "Invalid email or password.";
        }

        else if (error.code === "auth/user-not-found") {
          errorMessage = "No account found with this email.";
        }

        else if (error.code === "auth/wrong-password") {
          errorMessage = "Incorrect password.";
        }

        else if (error.code === "auth/invalid-email") {
          errorMessage = "Please enter a valid email address.";
        }

        else if (error.code === "auth/too-many-requests") {
          errorMessage = "Too many login attempts. Please try again later.";
        }

        else if (error.code === "auth/network-request-failed") {
          errorMessage = "Network error. Please check your internet connection.";
        }

        else {
          errorMessage = error.message;
        }


        msg.innerHTML =
          `<span class="text-danger">${errorMessage}</span>`;


        // Enable button again
        loginBtn.disabled = false;
        loginBtn.innerText = "Login";
      }

    };

  </script>
</head>


<body class="bg-light">

  <div class="container mt-5">

    <div class="row justify-content-center">

      <div class="col-md-4">

        <div class="card shadow p-4">

          <h3 class="text-center mb-3">
            Arham Dashboard Login
          </h3>


          <!-- Email -->
          <div class="form-group mb-3">

            <label for="email">
              Email
            </label>

            <input
              type="email"
              id="email"
              class="form-control"
              placeholder="Enter your email"
              autocomplete="username"
            />

          </div>


          <!-- Password -->
          <div class="form-group mb-3">

            <label for="password">
              Password
            </label>

            <input
              type="password"
              id="password"
              class="form-control"
              placeholder="Enter your password"
              autocomplete="current-password"
            />

          </div>


          <!-- Login Button -->
          <button
            id="loginBtn"
            onclick="loginUser()"
            class="btn btn-primary w-100"
          >
            Login
          </button>


          <!-- Message -->
          <div
            id="message"
            class="mt-3 text-center"
          ></div>

        </div>

      </div>

    </div>

  </div>


  <!-- Enter key support -->
  <script>

    document.addEventListener("keydown", function(event) {

      if (event.key === "Enter") {

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();

        if (email && password) {
          window.loginUser();
        }

      }

    });

  </script>

</body>
</html>
